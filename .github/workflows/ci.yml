name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The required check always reports; only the build is skipped for docs-only PRs.
      - name: Detect code changes
        id: changes
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -vqE '^(docs/|[^/]*\.md$|LICENSE$)'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm build
        if: steps.changes.outputs.code == 'true'
