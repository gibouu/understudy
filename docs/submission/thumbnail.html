<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Understudy thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7efe2; --card:#fbf6ec; --ink:#16283f; --deep:#0c1a2e; --soft:#5b6b80; --orange:#cf5220; --sun:#efb340; --line:#0c1a2e; --title:#0c1a2e; --pitch:#16283f;
          --disp:"Fraunces",Georgia,serif; --mono:"JetBrains Mono",Menlo,monospace; }
  body.dark { --bg:#0c1a2e; --card:#132640; --soft:#9fb0c6; --line:#f7efe2; --title:#f7efe2; --pitch:#e9dfcd; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1800px; height:1200px; overflow:hidden; background:var(--bg); }
  .page { position:relative; width:1800px; height:1200px; padding:78px 90px; }
  .stars { position:absolute; inset:0; opacity:0; }
  body.dark .stars { opacity:.55; background-image:radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 33% 9%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 71% 14%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 88% 26%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 57% 22%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 94% 8%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 46% 4%, #fff 50%, transparent 51%); }
  .top { position:relative; display:flex; align-items:flex-end; justify-content:space-between; }
  h1 { font-family:var(--disp); font-weight:800; font-size:200px; line-height:.86; letter-spacing:-.025em; color:var(--title); font-variation-settings:"opsz" 144; }
  h1 span { background:linear-gradient(transparent 72%, var(--sun) 72%, var(--sun) 88%, transparent 88%); }
  body.dark h1 span { background:none; }
  .pitch { font-family:var(--disp); font-weight:600; font-size:58px; line-height:1.06; color:var(--pitch); text-align:right; padding-bottom:10px; }
  .pitch em { font-style:normal; color:var(--orange); }
  body.dark .pitch em { color:var(--sun); }
  .row { position:absolute; left:90px; right:90px; top:400px; height:640px; display:flex; align-items:center; gap:0; }
  .panel { position:relative; flex:1; height:100%; border:4px solid var(--line); border-radius:26px; overflow:hidden; background:#000; }
  .panel img { width:100%; height:100%; object-fit:cover; display:block; }
  .p1 img { object-position:62% 40%; transform:scale(1.04); transform-origin:62% 40%; }
  .p2 img { object-position:50% 60%; }
  .p1 { box-shadow:14px 14px 0 var(--orange); }
  .p2 { box-shadow:14px 14px 0 var(--sun); }
  .gap { width:120px; display:flex; justify-content:center; }
  .gap svg { width:96px; height:96px; }
  .label { position:absolute; left:22px; bottom:22px; font-family:var(--mono); font-weight:700; font-size:30px; letter-spacing:.02em; padding:12px 20px; border-radius:14px; }
  .p1 .label { background:var(--card); color:var(--title); }
  .p2 .label { background:var(--deep); color:#fff8ee; }
  body.dark .p1 .label { background:#f7efe2; color:#0c1a2e; }
  .bubble { position:absolute; left:50%; top:-118px; transform:translateX(-50%) rotate(-1.5deg); width:600px; z-index:3; padding:20px 28px 18px; background:#fff; border:4px solid var(--deep); border-radius:22px; box-shadow:10px 10px 0 var(--orange); font-family:var(--disp); font-weight:600; font-size:30px; line-height:1.18; color:var(--deep); }
  .bubble small { display:block; margin-bottom:8px; font-family:var(--mono); font-weight:700; font-size:20px; letter-spacing:.08em; text-transform:uppercase; color:var(--orange); }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-26px; width:40px; height:40px; background:#fff; border-right:4px solid var(--deep); border-bottom:4px solid var(--deep); transform:translateX(-50%) rotate(45deg); }
  .row { top:430px; height:620px; }
  .foot { position:absolute; left:90px; right:90px; bottom:46px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:26px; color:var(--soft); }
  .foot b { color:var(--title); font-weight:700; }
</style>
</head>
<body class="dark">
<div class="stars"></div>
<div class="page">
  <div class="top">
    <h1><span>Understudy</span></h1>
    <p class="pitch">Film it once.<br><em>Rehearse it in orbit.</em></p>
  </div>

  <div class="row">
    <div class="bubble"><small>the robot asks</small>“When does putting the seed film packet in the Veggie plant pillow tray count as done?”</div>
    <div class="panel p1">
      <img src="../../public/showcase/iss-veggie-seed-film.jpg" alt="Astronaut planting seed film aboard the ISS (NASA)">
      <div class="label">the astronaut, on the ISS</div>
    </div>
    <div class="gap">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style="color:var(--line)">
        <path d="M14 48 H78"/><path d="M52 20 L80 48 L52 76"/>
      </svg>
    </div>
    <div class="panel p2">
      <img src="arm-station.png" alt="Simulated SO-101 arm doing the same task in a station module, 0 g">
      <div class="label">the simulated robot, at 0 g</div>
    </div>
  </div>

  <div class="foot"><span>Nebius × NVIDIA Global AI Hackathon · Physical AI</span><span><b>Nemotron</b> on Nebius Token Factory</span></div>
</div>
</body>
</html>
